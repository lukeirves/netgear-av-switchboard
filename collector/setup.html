<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NETGEAR AV Switchboard Setup</title><link rel="stylesheet" href="/setup.css"></head><body><main><header><span class="logo">N</span><div><b>NETGEAR AV</b><small>SWITCHBOARD SETUP</small></div></header><section class="intro"><p>WINDOWS COLLECTOR</p><h1>Connect your AV network</h1><span>Choose which adapter talks to the switches and where clients can reach the dashboard.</span></section><form id="settings"><fieldset><legend>Switch network</legend><label><span>Management subnet</span><input name="subnet" required placeholder="10.1.0.0/24"><small>This can be changed whenever the network moves.</small></label><label><span>Switch-facing adapter IP</span><input name="sourceAddress" placeholder="Automatic"><small>Leave blank to let Windows choose the route.</small></label></fieldset><fieldset><legend>SNMPv3 security</legend><div class="pair"><label><span>Username</span><input name="username" required placeholder="dashboard"></label><label><span>Security</span><input value="SHA-512 + AES (authPriv)" disabled></label></div><label><span>Authentication key</span><input name="authKey" type="password" minlength="8" autocomplete="new-password"><small id="authHint">Enter the key configured on every switch.</small></label><label><span>Encryption key</span><input name="privKey" type="password" minlength="8" autocomplete="new-password"><small id="privHint">Enter the AES key configured on every switch.</small></label></fieldset><fieldset><legend>Dashboard access</legend><div class="pair"><label><span>Client-facing adapter IP</span><input name="bindAddress" placeholder="0.0.0.0"><small>Use 0.0.0.0 to serve through all adapters.</small></label><label><span>Polling interval</span><select name="pollSeconds"><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">1 minute</option><option value="300">5 minutes</option></select></label></div></fieldset><div id="message" role="status"></div><button type="submit">Save settings & scan network</button></form><footer>Credentials stay on this Windows computer and are never sent to the dashboard.</footer></main><script src="/setup.js"></script></body></html>
